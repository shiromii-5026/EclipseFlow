server:
  port: 8095

spring:
  # 本地密钥文件（已被 .gitignore 忽略）：存在就自动加载，不存在则回落到环境变量
  config:
    import: "optional:file:./application-secrets.yml"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/eclipse_flow?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT / VAPID 密钥：不给默认值，必须由环境变量或 application-secrets.yml 提供
eclipse-flow:
  jwt:
    secret: ${JWT_SECRET}
    expiration-days: ${JWT_EXPIRATION_DAYS:7}
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY}
    vapid-private-key: ${VAPID_PRIVATE_KEY}
