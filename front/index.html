<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EclipseFlow | 多平台日程助手</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100..900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="style.css">
    <script>
    // 没有 token 就跳登录页
    if (!localStorage.getItem('eclipse_token')) {
        window.location.href = 'login.html';
    }
    // 注册 Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
    }
    </script>
</head>
<body class="light-theme">
    <aside class="sidebar">
        <div class="logo-area">
            <span class="material-symbols-outlined filled">tonality</span>
            <span class="logo-text">EclipseFlow</span>
        </div>
        <div class="logo-divider-line"></div>
        
        <!-- 迷你日历：ID 已与 JS 对齐 -->
        <div class="mini-calendar">
            <div class="month-nav">
                <button id="prev-month-btn">＜</button>
                <span id="mini-month-label">加载中...</span>
                <button id="next-month-btn">＞</button>
            </div>
            <div class="mini-grid-head">
                <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
            </div>
            <div id="mini-days" class="mini-days"></div>
            <button id="back-to-today-btn" class="today-link">回到当前日期</button>
        </div>

        <!-- 好友系统 -->
        <div id="friends-panel" class="countdown-panel">
            <div class="countdown-header">
                <span class="countdown-icon material-symbols-outlined">group</span>
                <span class="countdown-title">好友</span>
            </div>
            <div style="display:flex;gap:4px;margin-bottom:8px;">
                <input id="friend-search-input" class="quick-input" placeholder="搜索用户" style="flex:1;height:32px;font-size:0.72rem;padding:0 8px;border-radius:8px;">
                <button id="friend-search-btn" style="height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:0.7rem;cursor:pointer;">添加</button>
            </div>
            <div id="friend-list" class="countdown-list">
                <span class="countdown-empty">暂无好友</span>
            </div>
            <div id="friend-requests" class="countdown-list" style="margin-top:4px;"></div>
        </div>

        <!-- 实时倒计时 -->
        <div id="countdown-panel" class="countdown-panel">
            <div class="countdown-header">
                <span class="countdown-icon material-symbols-outlined">timer</span>
                <span class="countdown-title">进行中</span>
            </div>
            <div id="countdown-list" class="countdown-list">
                <span class="countdown-empty">-</span>
            </div>
            <div class="countdown-header" style="margin-top:12px;">
                <span class="countdown-icon material-symbols-outlined">schedule</span>
                <span class="countdown-title">即将开始</span>
            </div>
            <div id="upcoming-list" class="countdown-list">
                <span class="countdown-empty">-</span>
            </div>
        </div>

    </aside>

    <main class="main-content">
        <!-- 顶部导航与主题切换 -->
        <div class="top-right-nav">
            <div class="user-meta-group">
                <div class="user-text">
                    <span class="u-name">OPERATOR_01</span>
                    <span class="u-status">在线 // 实时同步</span>
                </div>
                <img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=Eclipse" alt="Avatar" class="avatar-pixel">
            </div>
            <button id="theme-btn" class="theme-btn" title="切换夜间模式">
                <span class="material-symbols-outlined">contrast</span>
            </button>
            <button id="logout-btn" class="theme-btn" title="退出登录" style="font-size:0.7rem;font-weight:900;">出</button>
        </div>

        <header>
            <h1 id="range-title">日程安排 // 加载中...</h1>
            <div class="header-divider">
                <div class="acid-segment"></div>
                <div class="header-barcode"></div>
            </div>
        </header>

        <!-- 核心日程网格 -->
        <div id="weekly-scroll-container">
            <div class="weekly-grid" id="weekly-grid">
                <!-- 由 app.js 动态渲染 -->
            </div>
        </div>

        <!-- 任务录入区 -->
        <section id="add-task-section">
            <h2 class="form-title">丨 新建任务录入</h2>

            <div class="geometric-add-form">

                <input
                    type="text"
                    id="task-name-input"
                    placeholder="任务内容 (例如: 高等数学作业)"
                >

                <div class="input-group">

                    <input type="date" id="task-date-input">

                    <div class="time-picker-cyber">
                        <select id="task-hour-select" class="cyber-select"></select>
                        <span class="cyber-divider">:</span>
                        <select id="task-min-select" class="cyber-select"></select>
                    </div>

                    <div class="time-picker-cyber">
                        <span class="deadline-label">⏱ 截止（可选）</span>
                        <select id="task-deadline-hour-select" class="cyber-select">
                            <option value="">--</option>
                        </select>
                        <span class="cyber-divider">:</span>
                        <select id="task-deadline-min-select" class="cyber-select">
                            <option value="">--</option>
                        </select>
                    </div>

                    <select id="task-color-select">
                        <option value="#b5d528aa">翠绿（默认）</option>
                        <option value="#f89828aa">鲜橙</option>
                        <option value="#5eb8e8">天蓝</option>
                        <option value="#f07880">赤红</option>
                        <option value="#b088e0aa">淡紫</option>
                    </select>

                    <button id="save-task-btn">
                        立即保存 +
                    </button>

                </div>

                <!-- 图片拖拽上传 + OCR 识别 -->
                <div id="ocr-drop-zone" class="ocr-drop-zone">
                    <span class="ocr-drop-icon material-symbols-outlined">imagesmode</span>
                    <span class="ocr-drop-text">拖拽图片到这里，自动识别文字填表</span>
                    <span class="ocr-drop-hint">或点击选择文件</span>
                    <input type="file" id="ocr-file-input" accept="image/*" hidden>
                    <span id="ocr-status" class="ocr-status"></span>
                </div>

            </div>
        </section>
    </main>

    <!-- 聊天弹窗 -->
    <div id="chat-modal" class="chat-modal hidden">
        <div class="chat-header">
            <span id="chat-friend-name">聊天</span>
            <button id="chat-close-btn" class="quick-close-btn">✕</button>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-row">
            <input id="chat-input" placeholder="输入消息...">
            <button id="chat-send-btn">发送</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="app.js"></script>
    <!-- 任务右键菜单 -->
    <div id="task-context-menu" class="task-context-menu hidden">
        <button class="context-item" data-action="edit">
           编辑任务
        </button>

        <button class="context-item" data-action="time">
            调整时间
        </button>

        <button class="context-item" data-action="color">
            更换颜色
        </button>

        <div class="context-divider"></div>

        <button class="context-item danger" data-action="delete">
            删除任务
        </button>
    </div>
</body>
</html>
